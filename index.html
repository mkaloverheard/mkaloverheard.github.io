<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKAL Overheard</title>
    <style>
        :root {
            --bg-color: #f0f3f8;
            --card-bg: #ffffff;
            --text-main: #1a1f2c;
            --text-muted: #64748b;
            --accent: #062970;
            --accent-hover: #041c4d;
            --accent-light: #e6ecf8;
            --border-color: #dce3f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        header {
            background-color: var(--accent);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            font-weight: 800;
        }
        header p {
            margin: 6px 0 0;
            font-size: 0.95rem;
            color: #cbd7f0;
        }
        .nav-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 10px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 6px rgba(6, 41, 112, 0.05);
        }
        .nav-btn {
            background: none;
            border: none;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .nav-btn:hover { color: var(--accent); }
        .nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .container {
            max-width: 960px;
            margin: 25px auto;
            padding: 0 16px;
        }
        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .controls-bar {
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .view-modes, .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .chip-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }
        .chip-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            background: #fff;
            color: var(--text-main);
        }
        .feed-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }
        .feed-grid.double {
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        }
        .feed-grid.compact .quote-card { padding: 14px 18px; }
        .feed-grid.compact .quote-note { display: none; }

        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .badge-loc {
            background: var(--accent-light);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .quote-text {
            font-size: 1.08rem;
            font-weight: 500;
            margin: 0 0 10px 0;
        }
        .quote-note {
            font-size: 0.88rem;
            color: var(--text-muted);
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
        }
        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .stats {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .like-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-main);
        }
        .like-btn.liked {
            background: #fee2e2;
            border-color: #ef4444;
            color: #dc2626;
        }
        .box-panel {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent);
            max-width: 650px;
            margin: 0 auto;
        }
        .box-panel h2 {
            margin-top: 0;
            color: var(--accent);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .submit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .submit-btn:hover { background: var(--accent-hover); }

        @media (max-width: 600px) {
            .feed-grid.double { grid-template-columns: 1fr; }
            .row-2 { grid-template-columns: 1fr; }
        }
    </style>
    <script>
        function sekmeAc(sekmeId, tiklananButon) {
            var sekmeler = document.getElementsByClassName("tab-section");
            for (var i = 0; i < sekmeler.length; i++) {
                sekmeler[i].style.display = "none";
                sekmeler[i].classList.remove("active");
            }
            var butonlar = document.getElementsByClassName("nav-btn");
            for (var j = 0; j < butonlar.length; j++) {
                butonlar[j].classList.remove("active");
            }
            var seciliSekme = document.getElementById(sekmeId);
            seciliSekme.style.display = "block";
            seciliSekme.classList.add("active");
            tiklananButon.classList.add("active");
        }

        function gorunumDegistir(mod, tiklananChip) {
            var grid = document.getElementById("feedGrid");
            grid.className = "feed-grid";
            if (mod === "double") grid.classList.add("double");
            if (mod === "compact") grid.classList.add("compact");

            var chipler = document.getElementsByClassName("chip-btn");
            for (var i = 0; i < chipler.length; i++) {
                chipler[i].classList.remove("active");
            }
            tiklananChip.classList.add("active");
        }

        function begeniDegistir(buton) {
            var sayiAlani = buton.getElementsByTagName("span")[0];
            var sayi = parseInt(sayiAlani.innerText);
            if (buton.classList.contains("liked")) {
                buton.classList.remove("liked");
                sayiAlani.innerText = sayi - 1;
            } else {
                buton.classList.add("liked");
                sayiAlani.innerText = sayi + 1;
            }
        }

        function kartlariSirala() {
            var grid = document.getElementById("feedGrid");
            var kartlar = Array.prototype.slice.call(grid.children);
            var mod = document.getElementById("sortSelect").value;

            kartlar.sort(function(a, b) {
                if (mod === "likes") {
                    return parseInt(b.getAttribute("data-likes")) - parseInt(a.getAttribute("data-likes"));
                } else if (mod === "oldest") {
                    return a.getAttribute("data-date").localeCompare(b.getAttribute("data-date"));
                } else {
                    return b.getAttribute("data-date").localeCompare(a.getAttribute("data-date"));
                }
            });
